name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for AWS OIDC role assumption in the deploy job

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Points the production build at the real API in CI/CD; local dev uses .env.local.
          REACT_APP_API_BASE_URL: ${{ secrets.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  lambdas:
    name: Lambdas — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lambdas/package-lock.json
      - name: Install
        working-directory: lambdas
        run: npm ci
      - name: Typecheck
        working-directory: lambdas
        run: npm run typecheck

  infrastructure:
    name: Infrastructure — typecheck + cdk synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json
      - name: Install (infrastructure)
        working-directory: infrastructure
        run: npm ci
      - name: Install (lambdas, bundled into the CDK asset)
        working-directory: lambdas
        run: npm ci
      - name: Typecheck
        working-directory: infrastructure
        run: npm run typecheck
      - name: cdk synth
        working-directory: infrastructure
        # Synth only needs the entry file's own TS/esbuild toolchain — no AWS credentials
        # required, so this genuinely runs as an automated check on every PR, not just
        # something that would only work in a real deploy.
        run: npx cdk synth -c amiId=ami-0000000000000000 -c stage=ci

  deploy:
    name: Deploy (main only)
    needs: [frontend, lambdas, infrastructure]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      # Requires a one-time AWS-side setup: an IAM role whose trust policy allows
      # GitHub's OIDC provider (token.actions.githubusercontent.com) to assume it,
      # scoped to this repo. No long-lived AWS access keys stored in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Install (infrastructure)
        working-directory: infrastructure
        run: npm ci
      - name: Install (lambdas)
        working-directory: lambdas
        run: npm ci

      - name: cdk deploy
        working-directory: infrastructure
        run: >
          npx cdk deploy --require-approval never
          --outputs-file cdk-outputs.json
          -c amiId=${{ secrets.AMI_ID }}
          -c keyPairName=${{ secrets.EC2_KEY_PAIR_NAME }}
          -c stage=prod

      - uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: infrastructure/cdk-outputs.json
          retention-days: 7
